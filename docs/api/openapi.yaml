openapi: 3.0.3
info:
  title: Nusantara Marketplace API
  version: 0.1.0
  description: |
    v1 contract for the pickup-only MVP, derived from what the Android screens need.
    Money is integer rupiah (int64). Timestamps are ISO-8601 UTC strings.
    Lists use opaque `cursor` pagination; `limit` defaults to 20, max 50.
    Authentication is a Bearer access token unless an operation says otherwise.
servers:
  - url: /
tags:
  - name: auth
  - name: me
  - name: catalog
  - name: social
  - name: orders
  - name: ads

paths:
  /v1/auth/otp/request:
    post:
      tags: [auth]
      operationId: requestOtp
      summary: Send a one-time code to a phone number (public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '204': { description: Code sent }
        '429': { $ref: '#/components/responses/Error' }
  /v1/auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyOtp
      summary: Exchange a one-time code for a session (public)
      description: 400 with code `OTP_INVALID` when the code is wrong or expired.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerify' }
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Error' }
  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the session using a refresh token (public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke a refresh token (public; the access token may already be expired)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Revoked }

  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    patch:
      tags: [me]
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /v1/me/devices:
    put:
      tags: [me]
      operationId: registerDevice
      summary: Register or refresh this device's push token (idempotent upsert)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRequest' }
      responses:
        '204': { description: Registered }

  /v1/categories:
    get:
      tags: [catalog]
      operationId: listCategories
      security: []
      responses:
        '200':
          description: All categories
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryList' }
  /v1/products:
    get:
      tags: [catalog]
      operationId: listProducts
      summary: Browse, search and filter products (public)
      security: []
      parameters:
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
        - { name: q, in: query, schema: { type: string } }
        - { name: featured, in: query, schema: { type: boolean } }
        - { name: sellerId, in: query, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: A page of products
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
  /v1/products/{productId}:
    get:
      tags: [catalog]
      operationId: getProduct
      summary: Product detail (public; `isFavorite` is null when anonymous)
      security: []
      parameters:
        - { name: productId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/sellers/{sellerId}:
    get:
      tags: [catalog]
      operationId: getSeller
      summary: Seller storefront (public; `isFollowing` is null when anonymous)
      security: []
      parameters:
        - { name: sellerId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Seller detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellerDetail' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/sellers/{sellerId}/reviews:
    get:
      tags: [catalog]
      operationId: listSellerReviews
      security: []
      parameters:
        - { name: sellerId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: A page of reviews
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPage' }

  /v1/me/favorites:
    get:
      tags: [social]
      operationId: listFavorites
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Favorite products
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
  /v1/me/favorites/{productId}:
    put:
      tags: [social]
      operationId: addFavorite
      parameters:
        - { name: productId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Added }
    delete:
      tags: [social]
      operationId: removeFavorite
      parameters:
        - { name: productId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Removed }
  /v1/me/following/{sellerId}:
    put:
      tags: [social]
      operationId: followSeller
      parameters:
        - { name: sellerId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Following }
    delete:
      tags: [social]
      operationId: unfollowSeller
      parameters:
        - { name: sellerId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Not following }
  /v1/order-items/{orderItemId}/reviews:
    post:
      tags: [social]
      operationId: submitReview
      summary: Review an item of a COMPLETED order (one review per item)
      description: 409 when the seller-order is not COMPLETED or the item was already reviewed.
      parameters:
        - { name: orderItemId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/cart/validate:
    post:
      tags: [orders]
      operationId: validateCart
      summary: Price and stock-check a cart, grouped by seller (public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartRequest' }
      responses:
        '200':
          description: Server-priced cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartValidation' }
  /v1/orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: Place an order (cash at pickup)
      description: |
        The same `Idempotency-Key` always returns the same order. Prices are recomputed on the
        server. 409 with code `INSUFFICIENT_STOCK` or `PRODUCT_UNAVAILABLE` when stock changed.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartRequest' }
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409': { $ref: '#/components/responses/Error' }
    get:
      tags: [orders]
      operationId: listOrders
      summary: The caller's orders, newest first
      description: |
        `tab`: ALL; PROCESSING = CREATED..SELLER_PROCESSING; READY = READY_FOR_PICKUP;
        DONE = COMPLETED + CANCELLED.
      parameters:
        - name: tab
          in: query
          schema: { type: string, enum: [ALL, PROCESSING, READY, DONE], default: ALL }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: A page of orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
  /v1/orders/{orderId}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: One order (owner only)
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/ads:
    get:
      tags: [ads]
      operationId: listAds
      summary: Ads for one placement, highest priority first (public)
      security: []
      parameters:
        - name: placement
          in: query
          required: true
          schema:
            type: string
            enum: [home_partner_carousel, home_sponsored_card, post_purchase, wait_state]
      responses:
        '200':
          description: Ads for the placement (possibly empty)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdList' }

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `nextCursor`
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, format: int32, minimum: 1, maximum: 50, default: 20 }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message]
      description: |
        Codes used by the app: OTP_INVALID, OTP_RATE_LIMITED, INSUFFICIENT_STOCK,
        PRODUCT_UNAVAILABLE.
      properties:
        code: { type: string }
        message: { type: string }

    ImageSet:
      type: object
      description: Pre-resized variants (about 320, 640 and 1080 px wide).
      required: [small, medium, large]
      properties:
        small: { type: string }
        medium: { type: string }
        large: { type: string }

    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, description: 'E.164, e.g. +6281234567890' }
    OtpVerify:
      type: object
      required: [phone, code]
      properties:
        phone: { type: string }
        code: { type: string }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    UpdateMeRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
    DeviceRequest:
      type: object
      required: [fcmToken]
      properties:
        fcmToken: { type: string }
    User:
      type: object
      required: [id, phone]
      properties:
        id: { type: integer, format: int64 }
        phone: { type: string }
        name: { type: string }
    Session:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: '#/components/schemas/User' }

    Category:
      type: object
      required: [id, name, iconKey]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        iconKey: { type: string }
    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Category' }

    SellerSummary:
      type: object
      required: [id, name, location, rating, ratingCount, pickupAddress, openingHours, whatsapp]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        avatar: { $ref: '#/components/schemas/ImageSet' }
        location: { type: string }
        rating: { type: number, format: double }
        ratingCount: { type: integer, format: int32 }
        pickupAddress: { type: string }
        openingHours: { type: string }
        whatsapp: { type: string, description: 'E.164' }
    SellerDetail:
      type: object
      required: [seller, description, followerCount]
      properties:
        seller: { $ref: '#/components/schemas/SellerSummary' }
        description: { type: string }
        followerCount: { type: integer, format: int32 }
        isFollowing: { type: boolean, nullable: true }

    ProductSummary:
      type: object
      required: [id, name, sellerId, sellerName, price, image, rating, ratingCount, stock, halalVerified]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        sellerId: { type: integer, format: int64 }
        sellerName: { type: string }
        price: { type: integer, format: int64, description: Retail price in rupiah }
        image: { $ref: '#/components/schemas/ImageSet' }
        rating: { type: number, format: double }
        ratingCount: { type: integer, format: int32 }
        stock: { type: integer, format: int32 }
        halalVerified: { type: boolean, description: True only when an operator verified the halal certificate }
    ProductDetail:
      type: object
      required: [product, description, images, seller]
      properties:
        product: { $ref: '#/components/schemas/ProductSummary' }
        description: { type: string }
        images:
          type: array
          items: { $ref: '#/components/schemas/ImageSet' }
        seller: { $ref: '#/components/schemas/SellerSummary' }
        isFavorite: { type: boolean, nullable: true }
    ProductPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }
        nextCursor: { type: string, nullable: true }

    Review:
      type: object
      required: [id, rating, authorName, createdAt]
      properties:
        id: { type: integer, format: int64 }
        rating: { type: integer, format: int32, minimum: 1, maximum: 5 }
        text: { type: string }
        authorName: { type: string }
        createdAt: { type: string, description: ISO-8601 UTC }
    ReviewInput:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, format: int32, minimum: 1, maximum: 5 }
        text: { type: string, maxLength: 500 }
    ReviewPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        nextCursor: { type: string, nullable: true }

    CartLineInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: integer, format: int64 }
        quantity: { type: integer, format: int32, minimum: 1 }
    CartRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          items: { $ref: '#/components/schemas/CartLineInput' }
    LineIssue:
      type: string
      enum: [OUT_OF_STOCK, INSUFFICIENT_STOCK, PRODUCT_UNAVAILABLE]
    ValidatedLine:
      type: object
      required: [productId, name, image, quantity, unitPrice, lineTotal, availableStock]
      properties:
        productId: { type: integer, format: int64 }
        name: { type: string }
        image: { $ref: '#/components/schemas/ImageSet' }
        quantity: { type: integer, format: int32 }
        unitPrice: { type: integer, format: int64 }
        lineTotal: { type: integer, format: int64 }
        issue: { $ref: '#/components/schemas/LineIssue' }
        availableStock: { type: integer, format: int32 }
    CartGroup:
      type: object
      required: [seller, lines]
      properties:
        seller: { $ref: '#/components/schemas/SellerSummary' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/ValidatedLine' }
    CartValidation:
      type: object
      required: [groups, total]
      properties:
        groups:
          type: array
          items: { $ref: '#/components/schemas/CartGroup' }
        total: { type: integer, format: int64 }

    OrderStatus:
      type: string
      enum: [CREATED, SELLER_PROCESSING, READY_FOR_PICKUP, COMPLETED, CANCELLED]
    PaymentMethod:
      type: string
      enum: [CASH_AT_PICKUP]
    StatusChange:
      type: object
      required: [status, at]
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        at: { type: string, description: ISO-8601 UTC }
    OrderItem:
      type: object
      required: [id, productId, name, image, quantity, unitPrice, lineTotal, reviewed]
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        name: { type: string }
        image: { $ref: '#/components/schemas/ImageSet' }
        quantity: { type: integer, format: int32 }
        unitPrice: { type: integer, format: int64 }
        lineTotal: { type: integer, format: int64 }
        reviewed: { type: boolean }
    SellerOrder:
      type: object
      description: Pickup fields are the snapshot taken when the order was placed.
      required: [id, sellerId, sellerName, whatsapp, pickupAddress, openingHours, status, subtotal, items]
      properties:
        id: { type: integer, format: int64 }
        sellerId: { type: integer, format: int64 }
        sellerName: { type: string }
        whatsapp: { type: string }
        pickupAddress: { type: string }
        openingHours: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        note: { type: string }
        subtotal: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
    Order:
      type: object
      required: [id, number, status, createdAt, total, paymentMethod, sellerOrders, statusHistory]
      properties:
        id: { type: integer, format: int64 }
        number: { type: string, description: 'Display number, e.g. NM-20261015-001' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        createdAt: { type: string, description: ISO-8601 UTC }
        total: { type: integer, format: int64 }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        sellerOrders:
          type: array
          items: { $ref: '#/components/schemas/SellerOrder' }
        statusHistory:
          type: array
          items: { $ref: '#/components/schemas/StatusChange' }
    OrderPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        nextCursor: { type: string, nullable: true }

    AdPlacementKey:
      type: string
      enum: [home_partner_carousel, home_sponsored_card, post_purchase, wait_state]
    Ad:
      type: object
      required: [id, placement, title, image, targetUrl, label]
      properties:
        id: { type: integer, format: int64 }
        placement: { $ref: '#/components/schemas/AdPlacementKey' }
        title: { type: string }
        subtitle: { type: string }
        image: { $ref: '#/components/schemas/ImageSet' }
        targetUrl: { type: string }
        label: { type: string, description: 'Visible sponsored label, e.g. Kemitraan or Iklan' }
    AdList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Ad' }
